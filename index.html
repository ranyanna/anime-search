<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anime-search</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <nav>
      <div class="logo">
        <h2 class="page-logo"> <span>Ani</span>Boo</h2>
      </div>

      <ul>
        <li>
          <a href="#" class="search">Busca</a>
        </li>
        <li>
          <a href="#" class="favorites">Favoritos</a>
        </li>
        <li>
          <a href="#" class="top-animes">Top Animes</a>
        </li>
      </ul>
    </nav>

    <main>
      <section class="banner-container">
        <div class="banner-text">
        <p class="hero-label">Explore seu domínio</p>
        <h1 class="hero-title">
          Encontre seu próximo <span>anime favorito</span>
        </h1>
        <p class="hero-desc">
          Busque por nome, explore por gênero, salve os seus favoritos.
        </p>
        <form>
          <input
            type="search"
            name=""
            id="name"
            placeholder="Ex: Jujutsu Kaisen, Bleach, One Piece..."
            autocomplete="off"
          />
          <button type="submit" class="btn-search">Buscar</button>
        </form>
        </div>

        <div class="img-banner">
          <img src="assets/img/homura-banner.png" alt="Homura" class="hero-pic" />
        </div>
      </section>

      <section class="results-container">
        <div class="results"></div>

        <div class="loading-results hidden" id="loading-results">
          <p>Carregando...</p>
        </div>
      </section>

      <section class="fav-section">
        <button class="btn-fav" id="btn-fav">Ver Favoritos</button>
        <div class="cards-fav" id="cards-fav"></div>
      </section>
    </main>
    <script src="assets/js/script.js"></script>
  </body>
</html>
